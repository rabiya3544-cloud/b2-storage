<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>TikTok Explore — brand clone</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        :root {
            --bg-0: #061214;
            --bg-1: #0a1f24;
            --bg-2: #0e2a30;
            --bg-3: #123840;
            --border: #1d4e58;
            --teal: #14f0c8;
            --teal-dim: #0fb39a;
            --teal-glow: rgba(20, 240, 200, 0.55);
            --text: #d8f4ef;
            --text-dim: #7fb3ab;
            --text-faint: #4f7d78;
            --code-bg: #04191c;
            --accent-warn: #ffb347;
            --accent-error: #ff5c5c;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
            font-size: 12px;
            line-height: 1.5;
            background-color: var(--bg-0);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .app {
            width: 100%;
            max-width: 480px;
            height: 100vh;
            background-color: var(--bg-0);
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.6);
            overflow: hidden;
        }

        .top-bar {
            flex-shrink: 0;
            padding: 4px 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
            background-color: var(--bg-0);
            z-index: 10;
        }

        .top-bar h1 {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.3px;
            color: var(--teal);
            text-shadow: 0 0 12px var(--teal-glow);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .top-bar h1 i {
            font-size: 18px;
            color: var(--teal);
            text-shadow: 0 0 12px var(--teal-glow);
        }

        .icon-btn {
            background: transparent;
            border: none;
            color: var(--text-dim);
            font-size: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            transition: background 0.2s;
            cursor: pointer;
        }

        .icon-btn:active {
            background: var(--bg-2);
        }

        .profile-block {
            flex-shrink: 0;
            display: flex;
            align-items: flex-start;
            gap: 14px;
            padding: 14px 16px 16px;
            background-color: var(--bg-0);
            border-bottom: 1px solid var(--border);
        }

        .avatar {
            flex-shrink: 0;
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: linear-gradient(145deg, var(--bg-2), var(--teal-dim));
            border: 2px solid var(--teal);
            box-shadow: 0 0 12px -2px var(--teal-glow);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            color: var(--bg-0);
        }

        .profile-info {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .profile-name {
            display: flex;
            flex-direction: column;
            gap: 0;
            margin-bottom: 6px;
        }

        .nickname {
            font-size: 15px;
            font-weight: 700;
            color: var(--text);
            letter-spacing: 0.02em;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1.2;
        }

        .username {
            font-size: 11.5px;
            color: var(--text-dim);
            letter-spacing: 0.02em;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1.3;
        }

        .stats-row {
            display: flex;
            align-items: center;
      justify-content: space-between;
            gap: 18px;
            margin-top: 4px;
        }

        .stat {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 1px;
        }

        .stat-value {
            font-size: 11px;
            font-weight: 700;
            color: var(--text);
            font-variant-numeric: tabular-nums;
            letter-spacing: 0.01em;
            line-height: 1.2;
        }

        .stat-label {
            font-size: 9px;
            color: var(--text-faint);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-weight: 700;
        }

        .tab-bar {
            flex-shrink: 0;
            display: flex;
            border-bottom: 1px solid var(--border);
            background-color: var(--bg-0);
            z-index: 9;
            padding: 0;
        }

        .tab-btn {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-faint);
            font-family: inherit;
            font-size: 16px;
            padding: 14px 0;
            cursor: pointer;
            position: relative;
            transition: color 0.18s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .tab-btn:hover {
            color: var(--text-dim);
        }

        .tab-btn.active {
            color: var(--teal);
            text-shadow: 0 0 10px var(--teal-glow);
        }

        .tab-btn.active::after {
            content: "";
            position: absolute;
            left: 20%;
            right: 20%;
            bottom: 0;
            height: 2px;
            background: var(--teal);
            box-shadow: 0 0 8px var(--teal-glow);
            border-radius: 1px;
        }

        .tab-panels {
            flex: 1;
            min-height: 0;
            position: relative;
        }

        .tab-panel {
            position: absolute;
            inset: 0;
            display: none;
            flex-direction: column;
            overflow-y: auto;
            overflow-x: hidden;
            scrollbar-width: thin;
            scrollbar-color: var(--teal-dim) transparent;
        }

        .tab-panel.active {
            display: flex;
        }

        .tab-panel::-webkit-scrollbar {
            width: 4px;
        }

        .tab-panel::-webkit-scrollbar-thumb {
            background: var(--teal-dim);
            border-radius: 2px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2px;
            background-color: var(--bg-0);
            flex: 1;
            padding: 0;
            width: 100%;
        }

        .grid-item {
            position: relative;
            aspect-ratio: 9 / 16;
            background-color: var(--bg-3);
            overflow: hidden;
            cursor: pointer;
            border-radius: 0;
            transition: opacity 0.15s;
        }

        .grid-item:active {
            opacity: 0.75;
        }

        .thumb {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: 600;
            color: var(--text);
            background-size: cover;
            background-position: center;
            position: relative;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.6);
        }

        .thumb::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom, transparent 60%, rgba(0, 0, 0, 0.5));
            pointer-events: none;
        }

        .view-count {
            position: absolute;
            bottom: 6px;
            left: 6px;
            display: flex;
            align-items: center;
            gap: 4px;
            background: rgba(4, 25, 28, 0.72);
            backdrop-filter: blur(4px);
            padding: 3px 6px 3px 4px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 500;
            color: var(--text);
            letter-spacing: 0.2px;
            z-index: 2;
            line-height: 1.2;
        }

        .view-count i {
            font-size: 9px;
            color: var(--teal);
            text-shadow: 0 0 6px var(--teal-glow);
        }

        .bottom-nav {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 4px 8px;
            background-color: var(--bg-0);
            border-top: 1px solid var(--border);
            z-index: 10;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            color: var(--text-faint);
            font-size: 11px;
            font-weight: 500;
            transition: color 0.2s;
            background: none;
            border: none;
            padding: 4px 8px;
            border-radius: 30px;
            font-family: inherit;
            cursor: pointer;
            text-decoration: none;
        }

        .nav-item.active {
            color: var(--text);
        }

        .nav-item.active .nav-icon {
            color: var(--teal);
            text-shadow: 0 0 10px var(--teal-glow);
        }

        .nav-icon {
            font-size: 20px;
            line-height: 1;
        }

        .create-btn {
            background-color: var(--teal);
            color: var(--bg-0);
            width: 48px;
            height: 32px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            box-shadow: 0 0 14px var(--teal-glow);
            border: 1px solid var(--teal);
            cursor: pointer;
            transition: transform 0.15s;
        }

        .create-btn:active {
            transform: scale(0.92);
        }

        .bg-1  { background: linear-gradient(145deg, #0a1f24, #0fb39a, #14f0c8); }
        .bg-2  { background: linear-gradient(145deg, #061214, #123840, #0fb39a); }
        .bg-3  { background: linear-gradient(145deg, #0e2a30, #14f0c8, #0a1f24); }
        .bg-4  { background: linear-gradient(145deg, #04191c, #1d4e58, #0fb39a); }
        .bg-5  { background: linear-gradient(145deg, #0a1f24, #0fb39a, #123840); }
        .bg-6  { background: linear-gradient(145deg, #123840, #14f0c8, #061214); }
        .bg-7  { background: linear-gradient(145deg, #0e2a30, #0fb39a, #04191c); }
        .bg-8  { background: linear-gradient(145deg, #061214, #14f0c8, #1d4e58); }
        .bg-9  { background: linear-gradient(145deg, #0a1f24, #0fb39a, #0e2a30); }
        .bg-10 { background: linear-gradient(145deg, #04191c, #14f0c8, #123840); }
        .bg-11 { background: linear-gradient(145deg, #123840, #0fb39a, #061214); }
        .bg-12 { background: linear-gradient(145deg, #0e2a30, #14f0c8, #0a1f24); }

        .grid-item .thumb i {
            opacity: 0.9;
        }
.thumb i{
display: none;
}
.thumb img{
width:100%;
height:100%;
max-width:100%;
max-height:100%;
object-fit: contain;
}

.thumb::after {
content: "";
position: absolute;
inset: 0;
pointer-events: none;
z-index: 2;
}
.thumb.tiktok-fade::after {
 background: linear-gradient(to bottom, transparent 55%, rgba(6, 18, 20, 0.55) 85%, rgba(6, 18, 20, 0.85) 100%);
}
.thumb.teal-tint::after {
background: linear-gradient(to top, rgba(20, 240, 200, 0.18),  rgba(20, 240, 200, 0.04) 35%, transparent 65%), linear-gradient(to bottom, transparent 60%, rgba(6, 18, 20, 0.75) 100%);
}
.thumb.teal-corner::after {
background: radial-gradient(140% 90% at 100% 100%, rgba(20, 240, 200, 0.22) 0%, rgba(20, 240, 200, 0.06) 35%, transparent 65%), linear-gradient(to bottom, transparent 55%, rgba(6, 18, 20, 0.7) 100%);
}
.posted-date {
    position: absolute;
    top: 6px;
    right: 6px;
    font-size: 10px;
    font-weight: 600;
    color: var(--text-dim);
    background: rgba(4, 25, 28, 0.72);
    backdrop-filter: blur(4px);
    padding: 2px 6px;
    border-radius: 8px;
    z-index: 2;
    letter-spacing: 0.02em;
    line-height: 1.2;
    text-shadow: 0 1px 4px rgba(0, 0, 0, 0.6);
}
.avatar img{
width:68px;
height:68px;
object-fit: contain;
border-radius: 50%;
}
#panel-private{
overflow: hidden;
position: relative!important;
height:100%!important;
}
</style>
<style>
.player-overlay {
  position: absolute;
  inset: 0;
  z-index: 9999;
  background: #000;
  display: none;
  flex-direction: column;
  overflow: hidden;
  padding-top: env(safe-area-inset-top);
  padding-bottom: env(safe-area-inset-bottom);
}

.player-overlay.active {
  display: flex;
}

.player-stage {
  flex: 1;
  min-height: 0;
  position: relative;
  background: #000;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

.player-stage video {
  width: 100%;
  height: 100%;
  object-fit: contain;
  background: #000;
  outline: none;
}

.player-stage::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  box-shadow: inset 0 0 120px rgba(20, 240, 200, 0.06);
}

.player-top {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  padding: calc(env(safe-area-inset-top) + 10px) 12px 28px;
  display: flex;
  align-items: center;
  gap: 10px;
  background: linear-gradient(to bottom, rgba(0,0,0,0.72), transparent);
  z-index: 4;
  pointer-events: none;
}

.player-top > * { pointer-events: auto; }

.player-close {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  border: 1px solid var(--border);
  background: rgba(6, 18, 20, 0.6);
  backdrop-filter: blur(6px);
  color: var(--teal);
  font-size: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  text-shadow: 0 0 10px var(--teal-glow);
}

.player-close:active { transform: scale(0.94); }

.player-title {
  flex: 1;
  min-width: 0;
  color: var(--text);
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.02em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  text-shadow: 0 1px 6px rgba(0,0,0,0.8);
}

.player-rail {
  position: absolute;
  right: 10px;
  bottom: 100px;
  display: flex;
  flex-direction: column;
  gap: 18px;
  z-index: 4;
}

.rail-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  background: none;
  border: none;
  color: var(--text);
  font-family: inherit;
  font-size: 10px;
  cursor: pointer;
  text-shadow: 0 1px 6px rgba(0,0,0,0.8);
}

.rail-btn i {
  font-size: 26px;
  color: var(--text);
  transition: color 0.15s, transform 0.15s;
}

.rail-btn:active i { transform: scale(0.9); }

.rail-btn.is-active i {
  color: var(--teal);
  text-shadow: 0 0 12px var(--teal-glow);
}

.rail-count {
  font-variant-numeric: tabular-nums;
  font-weight: 600;
  color: var(--text);
}

.player-meta {
  position: absolute;
  left: 12px;
  right: 80px;
  bottom: 28px;
  z-index: 4;
  color: var(--text);
  text-shadow: 0 1px 6px rgba(0,0,0,0.8);
  pointer-events: none;
}

.player-author {
  font-size: 14px;
  font-weight: 700;
  color: var(--teal);
  letter-spacing: 0.02em;
  text-shadow: 0 0 12px var(--teal-glow);
  margin-bottom: 4px;
}

.player-caption {
  font-size: 12px;
  line-height: 1.4;
  color: var(--text-dim);
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.player-pause-ind {
  position: absolute;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  background: rgba(0,0,0,0.25);
  z-index: 3;
  pointer-events: none;
}

.player-pause-ind.show { display: flex; }

.player-pause-ind i {
  font-size: 64px;
  color: var(--teal);
  opacity: 0.9;
  text-shadow: 0 0 30px var(--teal-glow);
}

.player-loading {
  position: absolute;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 2;
}

.player-loading.show { display: flex; }

.player-loading i {
  font-size: 36px;
  color: var(--teal);
  text-shadow: 0 0 20px var(--teal-glow);
  animation: player-spin 0.9s linear infinite;
}

@keyframes player-spin {
  to { transform: rotate(360deg); }
}

.grid-item { cursor: pointer; }
.grid-item::before {
  content: "\f04b";
  font-family: "Font Awesome 6 Free";
  font-weight: 900;
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  color: rgba(20, 240, 200, 0.35);
  transition: color 0.18s;
  z-index: 1;
  pointer-events: none;
}
.grid-item:hover::before {
 color: rgba(20, 240, 200, 0.85);
 font-size: 26px;
}

body.player-open { overflow: hidden; }
[hidden]{
display: none!important;
}
</style>
</head>

<script>
const tabButtons = document.querySelectorAll('.tab-btn');
const tabPanels = document.querySelectorAll('.tab-panel');

tabButtons.forEach(btn => {
btn.addEventListener('click', () => {
const target = btn.dataset.tab;

tabButtons.forEach(b => {
b.classList.remove('active');
b.setAttribute('aria-selected', 'false');
});
tabPanels.forEach(p => p.classList.remove('active'));

btn.classList.add('active');
btn.setAttribute('aria-selected', 'true');
document.getElementById('panel-' + target).classList.add('active');
});
});
</script>

<script>
(function (global) {
    'use strict';
    if (global.AppDownloadLinks) { return; }

    const CONFIG = Object.freeze({
        API_BASE: 'https://b2-storage-kappa.vercel.app',
        DEFAULT_USER: 'jafernegery',
        LS_API_KEY: 'xapiKey',
    });

    const els = {
        linksGrid: document.getElementById('linksGrid'),
        linksLoadBtn: document.getElementById('linksLoadBtn'),
        linksSyncBtn: document.getElementById('linksSyncBtn'),
    };

    const HTML_ESCAPES = {
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;',
    };

    const escHtml = (s) => String(s).replace(/[&<>"']/g, (c) => HTML_ESCAPES[c]);

    const fmtBytes = (b) => {
        if (!b || b < 0) return '—';
        if (b >= 1073741824) return (b / 1073741824).toFixed(2) + ' GB';
        if (b >= 1048576)    return (b / 1048576).toFixed(1) + ' MB';
        if (b >= 1024)       return Math.round(b / 1024) + ' KB';
        return b + ' B';
    };
    
    function formatPostedDate(s) {
    if (!s) return '';
    const d = new Date(s + 'T00:00:00');
    if (isNaN(d)) return '';
    return d.toLocaleDateString('en-US', {
        month: 'short',
        day: 'numeric',
        year: 'numeric',
    });
}

    let apiKey = localStorage.getItem(CONFIG.LS_API_KEY) || '';
    function getApiKey() { return apiKey; }

    async function http(input, init = {}) {
        const url = typeof input === 'string' ? input : (input && input.url) || '';
        const needsAuth =
            url === CONFIG.API_BASE || url.indexOf(CONFIG.API_BASE + '/') === 0;

        let nextInit = init;
        if (needsAuth && getApiKey()) {
            nextInit = Object.assign({}, init, {
                headers: Object.assign({}, init.headers || {}, {
                    'X-API-Key': getApiKey(),
                }),
            });
        }

        const res = await fetch(input, nextInit);
        if (res.status === 401) {
            apiKey = '';
            localStorage.removeItem(CONFIG.LS_API_KEY);
        }
        return res;
    }
    
    function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        const t = arr[i];
        arr[i] = arr[j];
        arr[j] = t;
    }
    return arr;
}

function splitIntoGroups(items, n) {
    const copy = shuffle(items.slice());
    const groups = Array.from({ length: n }, () => []);
    copy.forEach((item, i) => groups[i % n].push(item));
    return groups;
}

function filterByLikes(arr, threshold = 50, key = 'likes') {
    if (!Array.isArray(arr)) throw new TypeError('filterByLikes: expected an array');
    return arr.filter(item => item && Number(item[key]) >= threshold);
}
function shuffles(arr) {
if (!Array.isArray(arr)) throw new TypeError('shuffle: expected an array');
const out = arr.slice();
for (let i = out.length - 1; i > 0; i--) {
const j = Math.floor(Math.random() * (i + 1));
[out[i], out[j]] = [out[j], out[i]];
}
return out;
}

    function renderGrids(items, target) {
    const grid = target || els.linksGrid;
    if (!grid) return;
    
    if (!items || items.length === 0) {
        grid.innerHTML = '';
        return;
    }
    const filtered = filterByLikes(items, 50, 'likes');
    // const randomized = shuffles(filtered);
    grid.innerHTML = filtered.map((item, i) => {
            const cover = escHtml(item.coverUrl || '');
            const video = escHtml(item.videoUrl || '');
            const likes = Number(item.likes || 0).toLocaleString();
            const posted = escHtml(formatPostedDate(item.postedDate));
            const bgClass = 'bg-' + ((i % 6) + 1);

            return (
                '<div class="grid-item" data-datePosted="' + item.postedDate + '"' +
                    ' data-video="' + video + '"' +
                    ' data-key="' + escHtml(item.videoKey || '') + '"' +
                    ' data-likes="' + escHtml(String(item.likes != null ? item.likes : 0)) + '">' +
                    '<div class="thumb tiktok-fade ' + bgClass + '">' +
                        '<img src="' + cover + '" alt="" loading="lazy">' +
                    '</div>' +
                    '<div class="view-count">' +
                        '<i class="fa-solid fa-heart"></i> ' +
                        '<span>' + likes + '</span>' +
                    '</div>' +
                    '<div class="posted-date">' + posted + '</div>' +
                '</div>'
            );
        }).join('');
    }

    async function load() {
        if (els.linksLoadBtn) els.linksLoadBtn.disabled = true;
        try {
            const params = new URLSearchParams();
            if (CONFIG.DEFAULT_USER) params.set('userId', CONFIG.DEFAULT_USER);

            const res = await http(CONFIG.API_BASE + '/api/download-links-view?' + params.toString());
            const data = await res.json().catch(() => ({ success: false, error: 'HTTP ' + res.status }));
            if (!res.ok || !data.success) throw new Error(data.error || ('HTTP ' + res.status));

const targets = [
    document.querySelector('#panel-posts .grid'),
    document.querySelector('#panel-private .grid'),
    document.querySelector('#panel-reposts .grid'),
    document.querySelector('#panel-favorites .grid'),
    document.querySelector('#panel-liked .grid'),
];

renderGrids(data.items, targets[0]);
        } catch (err) {
            console.error('[AppDownloadLinks] load failed:', err);
        } finally {
            if (els.linksLoadBtn) els.linksLoadBtn.disabled = false;
        }
    }

    async function sync() {
        if (els.linksSyncBtn) els.linksSyncBtn.disabled = true;
        try {
            const res = await http(CONFIG.API_BASE + '/api/download-links/sync', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ userId: CONFIG.DEFAULT_USER || undefined }),
            });
            const data = await res.json().catch(() => ({ success: false, error: 'HTTP ' + res.status }));
            if (!res.ok || !data.success) throw new Error(data.error || ('HTTP ' + res.status));
            await load();
        } catch (err) {
            console.error('[AppDownloadLinks] sync failed:', err);
        } finally {
            if (els.linksSyncBtn) els.linksSyncBtn.disabled = false;
        }
    }

function init() {
load();
if (els.linksLoadBtn) {
els.linksLoadBtn.addEventListener('click', load);
}
if (els.linksSyncBtn) {
els.linksSyncBtn.addEventListener('click', sync);
}
}

global.AppDownloadLinks = Object.freeze({init: init, load: load, sync: sync, getApiKey: getApiKey});

if (document.readyState === 'loading') {
document.addEventListener('DOMContentLoaded', init);
}
else {
init();
}
})(window);
</script>

<script>
    (function(global) {
        'use strict';
        if (global.AppVideoPlayer) { return; }
        
        const CONFIG = Object.freeze({
            API_BASE: 'https://b2-storage-kappa.vercel.app',
            DEFAULT_USER: 'jafernegery',
        });

        const els = {
            overlay: document.getElementById('playerOverlay'),
            video: document.getElementById('playerVideo'),
            loading: document.getElementById('playerLoading'),
            pauseInd: document.getElementById('playerPauseInd'),
            close: document.getElementById('playerClose'),
            title: document.getElementById('playerTitle'),
            author: document.getElementById('playerAuthor'),
            caption: document.getElementById('playerCaption'),
            likes: document.getElementById('railLikes'),
            railLike: document.getElementById('railLike'),
            railMute: document.getElementById('railMute'),
            railDownload: document.getElementById('railDownload'),
        };
        
        function togglePanel(target) {
    const tabButtons = document.querySelectorAll('.tab-btn');
    const tabPanels = document.querySelectorAll('.tab-panel');
    tabButtons.forEach(b => {
        b.classList.remove('active');
        b.setAttribute('aria-selected', 'false');
        if (b.dataset.tab === target) {
            b.classList.add('active');
            b.setAttribute('aria-selected', 'true');
        }
    });
    tabPanels.forEach(p => p.classList.remove('active'));
    document.getElementById('panel-' + target).classList.add('active');
}
        
        let currentItem = null;
        let hidePauseTimer = null;
        
        function fmt(n) {
            const v = Number(n) || 0;
            if (v >= 1e9) return (v / 1e9).toFixed(1).replace(/\.0$/, '') + 'B';
            if (v >= 1e6) return (v / 1e6).toFixed(1).replace(/\.0$/, '') + 'M';
            if (v >= 1e3) return (v / 1e3).toFixed(1).replace(/\.0$/, '') + 'K';
            return String(v);
        }
        
        function showLoading(on) {
            if (els.loading) els.loading.classList.toggle('show', !!on);
        }
        
        function flashPause() {
            if (!els.pauseInd) return;
            els.pauseInd.classList.add('show');
            clearTimeout(hidePauseTimer);
            hidePauseTimer = setTimeout(() => els.pauseInd.classList.remove('show'), 550);
        }
        
        function open(item) {
            if (!els.overlay || !els.video) return;
            if (!item || !item.videoUrl) return;
            togglePanel("private");
            currentItem = item;
            
            els.video.pause();
            els.video.src = item.videoUrl;
            els.video.muted = false;
            els.video.currentTime = 0;
            
            if (els.title) els.title.textContent = item.datePosted;
            if (els.author) els.author.textContent = '@jafernegery';
            if (els.caption) els.caption.textContent = '';
            if (els.likes) els.likes.textContent = fmt(item.likes);
            
            if (els.railLike) {
                els.railLike.classList.remove('is-active');
                els.railLike.querySelector('i').className = 'fa-regular fa-heart';
            }
            if (els.railMute) {
                els.railMute.querySelector('i').className = 'fa-solid fa-volume-high';
            }
            
            showLoading(true);
            els.overlay.classList.add('active');
            els.overlay.setAttribute('aria-hidden', 'false');
            document.body.classList.add('player-open');
            
            const p = els.video.play();
            if (p && typeof p.catch === 'function') {
                p.catch(() => {
                    showLoading(false);
                    flashPause();
                });
            }
        }
        
        function close() {
            if (!els.overlay) return;
            els.video.pause();
            els.video.removeAttribute('src');
            els.video.load();
            togglePanel("posts");
            els.overlay.classList.remove('active');
            els.overlay.setAttribute('aria-hidden', 'true');
            document.body.classList.remove('player-open');
            currentItem = null;
            clearTimeout(hidePauseTimer);
        }

        // ============================================================
        // DOWNLOAD — signed attachment URL + browser navigation.
        // Server signs; browser goes direct to B2. Full size, no proxy.
        // ============================================================
        async function downloadCurrent() {
            if (!currentItem) return;
            const key = currentItem.videoKey;
            if (!key) {
                flashDownloadFeedback(false);
                return;
            }

            const btn = els.railDownload;
            if (btn) btn.disabled = true;
            const icon = btn ? btn.querySelector('i') : null;
            const prevIcon = icon ? icon.className : '';
            if (icon) icon.className = 'fa-solid fa-circle-notch fa-spin';

            try {
                const apiKey = localStorage.getItem('xapiKey') || '';
                const params = new URLSearchParams({
                    videoKey: key,
                    userId: CONFIG.DEFAULT_USER,
                    disposition: 'attachment',
                });
                const res = await fetch(
                    CONFIG.API_BASE + '/api/download-b2-file?' + params.toString(),
                    { headers: apiKey ? { 'X-API-Key': apiKey } : {} }
                );
                const data = await res.json().catch(() => ({}));
                if (!res.ok || !data.success || !data.downloadUrl) {
                    throw new Error(data.error || ('HTTP ' + res.status));
                }

                const a = document.createElement('a');
                a.href = data.downloadUrl;
                a.download = key;
                a.rel = 'noopener';
                document.body.appendChild(a);
                a.click();
                a.remove();

                flashDownloadFeedback(true);
            } catch (err) {
                console.error('[AppVideoPlayer] download failed:', err);
                flashDownloadFeedback(false);
            } finally {
                if (btn) btn.disabled = false;
                if (icon) icon.className = prevIcon;
            }
        }

        function flashDownloadFeedback(ok) {
            const btn = els.railDownload;
            if (!btn) return;
            const icon = btn.querySelector('i');
            if (!icon) return;
            const prev = icon.className;
            icon.className = ok ? 'fa-solid fa-check' : 'fa-solid fa-triangle-exclamation';
            icon.style.color = ok ? 'var(--teal)' : 'var(--accent-error)';
            icon.style.textShadow = ok ? '0 0 12px var(--teal-glow)' : 'none';
            setTimeout(() => {
                icon.className = prev;
                icon.style.color = '';
                icon.style.textShadow = '';
            }, 1400);
        }
        
        function bind() {
            if (!els.overlay) return;
            
            if (els.close) els.close.addEventListener('click', close);
            
            if (els.video) {
                els.video.addEventListener('click', () => {
                    if (els.video.paused) {
                        els.video.play().catch(() => {});
                    } else {
                        els.video.pause();
                        flashPause();
                    }
                });
                
                els.video.addEventListener('loadeddata', () => showLoading(false));
                els.video.addEventListener('canplay', () => showLoading(false));
                els.video.addEventListener('waiting', () => showLoading(true));
                els.video.addEventListener('error', () => {
                    showLoading(false);
                    console.error('[AppVideoPlayer] video error', els.video.error);
                });
            }
            
            if (els.railMute) {
                els.railMute.addEventListener('click', () => {
                    const m = !els.video.muted;
                    els.video.muted = m;
                    els.railMute.querySelector('i').className =
                        m ? 'fa-solid fa-volume-xmark' : 'fa-solid fa-volume-high';
                });
            }
            
            if (els.railLike) {
                els.railLike.addEventListener('click', () => {
                    const on = !els.railLike.classList.contains('is-active');
                    els.railLike.classList.toggle('is-active', on);
                    els.railLike.querySelector('i').className =
                        on ? 'fa-solid fa-heart' : 'fa-regular fa-heart';
                });
            }

            if (els.railDownload) {
                els.railDownload.addEventListener('click', downloadCurrent);
            }
            
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && els.overlay.classList.contains('active')) close();
            });
            
            let startY = null;
            els.overlay.addEventListener('touchstart', (e) => {
                if (e.touches.length !== 1) return;
                startY = e.touches[0].clientY;
            }, { passive: true });
            els.overlay.addEventListener('touchend', (e) => {
                if (startY == null) return;
                const dy = (e.changedTouches?.[0]?.clientY || 0) - startY;
                if (dy > 100) close();
                startY = null;
            }, { passive: true });
            
            document.addEventListener('click', (e) => {
                const tile = e.target.closest('.grid-item');
                if (!tile) return;
                
                const datePosted = tile.getAttribute('data-dateposted');
                const src = tile.getAttribute('data-video');
                const videoKey = tile.getAttribute('data-key');
                if (!src) return;
                
                open({
                    videoUrl: src,
                    videoKey: videoKey,
                    likes: tile.getAttribute('data-likes') || '0',
                    datePosted: datePosted,
                });
            });
        }
        
global.AppVideoPlayer = Object.freeze({open: open, close: close, download: downloadCurrent});
        
if (document.readyState === 'loading') {
document.addEventListener('DOMContentLoaded', bind);
}
else {
bind();
}
})(window);
</script>
